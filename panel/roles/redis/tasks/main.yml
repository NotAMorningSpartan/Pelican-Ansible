---
- name: Install Redis
  ansible.builtin.dnf:
    name: redis
    state: present

- name: Template Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: "0640"
  notify: Restart redis

- name: Enable and start Redis service
  ansible.builtin.systemd_service:
    name: redis
    state: started
    enabled: true
