---
- name: Install Nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Remove default Nginx configuration
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx

- name: Deploy Pelican Nginx configuration (SSL)
  ansible.builtin.template:
    src: nginx_ssl.conf.j2
    dest: /etc/nginx/conf.d/pelican.conf
    owner: root
    group: root
    mode: "0644"
  when: pelican_ssl_enabled | default(true)
  notify: Reload nginx

- name: Deploy Pelican Nginx configuration (HTTP)
  ansible.builtin.template:
    src: nginx_http.conf.j2
    dest: /etc/nginx/conf.d/pelican.conf
    owner: root
    group: root
    mode: "0644"
  when: not (pelican_ssl_enabled | default(true))
  notify: Reload nginx

- name: Register SELinux file context for Pelican install directory
  ansible.builtin.command:
    cmd: >-
      semanage fcontext -a -t httpd_sys_rw_content_t
      "{{ pelican_install_dir }}(/.*)?"
  register: semanage_result
  changed_when: semanage_result.rc == 0
  failed_when:
    - semanage_result.rc != 0
    - "'already defined' not in semanage_result.stderr"

- name: Enable and start Nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
