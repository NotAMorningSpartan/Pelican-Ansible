---
- name: Add Docker CE repository
  ansible.builtin.yum_repository:
    name: docker-ce
    description: Docker CE Stable
    baseurl: "https://download.docker.com/linux/rhel/$releasever/$basearch/stable"
    gpgkey: "https://download.docker.com/linux/rhel/gpg"
    gpgcheck: true
    enabled: true

- name: Install Docker CE packages
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present

- name: Enable and start Docker service
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Enable swap accounting in GRUB
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX="(?!.*swapaccount=1).*)"$'
    line: '\1 swapaccount=1"'
    backrefs: true
  when: wings_docker_enable_swap
  notify: Rebuild grub config

- name: Warn that reboot is required for swap accounting
  ansible.builtin.debug:
    msg: >-
      WARNING: Swap accounting has been enabled in GRUB.
      A reboot is required for this change to take effect.
  when: wings_docker_enable_swap
